<text x="484" y="405" fill="#fff" style="font-weight:700;font-size:12.5px">Save the unsaved work of demo/old-experiment?</text>
<text x="484" y="430" fill="#b5b5b5" style="font-size:10.8px">GitHub rejects a push to an archived repo, so demo/old-</text>
<text x="484" y="445" fill="#b5b5b5" style="font-size:10.8px">experiment is unarchived, these branches are pushed without</text>
<text x="484" y="460" fill="#b5b5b5" style="font-size:10.8px">creating any commit, then it is archived again, even if the push</text>
<text x="484" y="475" fill="#b5b5b5" style="font-size:10.8px">fails. It is writable for a few seconds.</text>
<text x="484" y="499" fill="#fff" style="font-weight:700;font-size:10.8px">Unpushed commits</text>
