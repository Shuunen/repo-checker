ight:500">Clone</text></g><g style="animation:r10 14s linear infinite;opacity:0"><line x1="190" x2="1236" y1="592" y2="592" stroke="#222"/><text x="203" y="576" fill="#f2f2f2" style="font-weight:600;font-size:11.5px">qbt-theme</text><rect width="84.15" height="15" x="314" y="565" fill="#1b2a45" rx="7.5"/><text x="320" y="575.5" fill="#6ea8fe" style="font-size:10px">pristine fork</text><text x="930" y="576" fill="#aaa" style="font-size:11px">—</text><text x="1030" y="576" fill="#aaa" style="font-size:11px">2026-09</text><rect width="92.6" height="23" x="1103" y="561" fill="#222" rx="11.5"/><text x="1113" y="576" fill="#e6e6e6" style="font-size:11.5px;font-weight:500">Delete fork</text></g><g style="animation:dlg 14s linear infinite;opacity:0"><rect width="1100" height="620" x="165" y="0" fill="#000" opacity=".62"/><g transform="translate(0,-166)"><rect width="330" height="200" x="466" y="376" fill="#161616" stroke="#2a2a2a" rx="16"/><text x="484" y="405" fill="#fff" style="font-weight:700;font-size:12.5px">Save the unsaved work of demo/old-experiment?</text><text x="484" y="430" fill="#b5b5b5" style="font-size:10.8px">GitHub rejects a push to an archived repo, so demo/old-</text><text x="484" y="445" fill="#b5b5b5" style="font-size:10.8px">experiment is unarchived, these branches are pushed without</text><text x="484" y="460" fill="#b5b5b5" style="font-size:10.8px">creating any commit, then it is archived again, even if the push</text><text x="484" y="475" fill="#b5b5b5" style="font-size:10.8px">fails. It is writable for a few seconds.</text><text x="484" y="499" fill="#fff" style="font-weight:700;font-size:10.8px">Unpushed commits</text><text x="498" y="514" fill="#b5b5b5" style="font-size:10.8px">• master: last idea, never pushed</text><rect width="55" height="26" x="554" y="533" fill="#2b2b2b" rx="13"/><text x="581.5" y="550" fill="#eee" text-anchor="middle" style="font-size:11.5px;font-weight:500">Cancel</text><rect width="163" height="26" x="615" y="533" fill="#